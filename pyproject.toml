[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servalfr"
version = "0.1.0"
description = "Simulation logistique générique ServalFR (organisation, scénarios, unités)."
authors = [
    { name = "Teremu / Major Hamblin" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
